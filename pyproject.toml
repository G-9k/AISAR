[project]
name = "currency-eval"
version = "0.1.0"
description = "Inspect port of the currency conversion constraint-subversion experiment (AISAR)."
requires-python = ">=3.11"
dependencies = [
    "inspect_ai>=0.3.285",
    "google-genai",
    "python-dotenv",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["currency_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
